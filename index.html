<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h1 id="h1_header">Calculator</h1>
</nav>

<div class="parent_box">

    <input type="text" class="child_input" readonly>

    <!-- Row 1 -->
    <div class="child_box">Back</div>
    <div class="child_box clear">C</div>
    <div class="child_box operator">/</div>
    <div class="child_box operator">*</div>

    <!-- Row 2 -->
    <div class="child_box">7</div>
    <div class="child_box">8</div>
    <div class="child_box">9</div>
    <div class="child_box operator">-</div>

    <!-- Row 3 -->
    <div class="child_box">4</div>
    <div class="child_box">5</div>
    <div class="child_box">6</div>
    <div class="child_box operator">+</div>

    <!-- Row 4 -->
    <div class="child_box">1</div>
    <div class="child_box">2</div>
    <div class="child_box">3</div>
    <div class="child_box operator">%</div>

    <!-- Row 5 -->
    <div class="child_box operator">00</div>
    <div class="child_box">0</div>
    <div class="child_box">.</div>
    <div class="child_box submit">=</div>

</div>

<script src="script.js"></script>

</body>
</html>
